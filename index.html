    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1624;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .logo-img {
            width: 120px;
            height: auto;
            border-radius: 12px;
            margin: 0 auto 20px auto;
            display: block;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 14px;
            color: #8b9bb4;
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 16px;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 25px 0 15px 0;
            text-align: left;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 5px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: 8px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: block;
            text-align: left;
        }

        .link-card:hover {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #0d1624;
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
            border-color: transparent;
        }

        footer {
            margin-top: 50px;
            font-size: 12px;
            color: #576574;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="favicon.jpg" alt="Maiom Corp Logo" class="logo-img">

        <div class="category-title">Desenvolvimento</div>
        <div class="links-container">

            <a href="https://maiomcorp-oss.github.io/Administract-Coder/" target="_blank" class="link-card">Administract Coder</a>
            <a href="https://maiomcorp-oss.github.io/RamCast.js/" target="_blank" class="link-card">RamCast.js</a>
            <a href="https://anygnorus.lovable.app/" target="_blank" class="link-card">Anygnorus</a>
            <a href="https://maiomcorp-oss.github.io/Consoploits/" target="_blank" class="link-card">Comsoploits</a>
        </div>

        <div class="category-title">Jogos</div>
        <div class="links-container">
            <a href="https://maiomcorp-oss.github.io/SandBlox/" target="_blank" class="link-card">SandBlox</a>
        </div>

        <div class="category-title">Estudos e Aprendizado</div>
        <div class="links-container">
            <a href="https://coffe-la-ajudadora.lovable.app/" target="_blank" class="link-card">Coffe IA</a>
        </div>

        <footer>
            © 2026 Maiom Corp. Todos os direitos reservados.
        </footer>
    </div>

</body>
